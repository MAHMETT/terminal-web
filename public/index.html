<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14161b" />
    <title>terminal-web</title>
    <!-- PWA / installable home-screen app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="terminal" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/dist/terminal.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Desktop top bar -->
    <div id="topbar">
      <div id="tabs" role="tablist"></div>
      <button class="tab-add" id="addTab" title="New session" aria-label="New session">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="controls"></div>
    </div>

    <!-- Terminal area -->
    <div id="terminal"></div>

    <!-- On-screen key bar (touch devices) -->
    <div id="keybar" class="hidden"></div>

    <!-- Status bar (bottom) -->
    <div class="statusbar" id="statusbar">
      <div class="status-item"><span class="status-dot" id="connDot"></span><span id="connLabel">connected</span></div>
      <div class="status-item" id="shellLabel">zsh</div>
      <div class="status-item" id="pathLabel">~</div>
      <div class="spacer"></div>
      <div class="status-item" id="layoutLabel">1 panel</div>
    </div>

    <!-- Status toast (top right) -->
    <div id="status" role="status" aria-live="polite"></div>

    <!-- Mobile top bar -->
    <div id="mobilebar"></div>

    <!-- Settings drawer overlay + drawer -->
    <div class="overlay" id="overlay"></div>
    <div class="sheet-overlay hidden" id="drawerOverlay">
      <div class="sheet" id="drawer">
        <div class="sheet-grip"></div>
        <div class="sheet-title">Settings</div>
        <div id="drawerBody"></div>
      </div>
    </div>

    <!-- Modal for new tab naming -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle">New session name</h3>
        <input type="text" id="newTabInput" maxlength="30" placeholder="e.g. server, logs, deploy" />
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modalCancel">Cancel</button>
          <button class="btn btn-primary" id="modalCreate">Create</button>
        </div>
      </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script type="module" src="/dist/terminal.js"></script>
  </body>
</html>
