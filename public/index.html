<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14161b" />
    <title>terminal-web</title>
    <!-- PWA / installable home-screen app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="terminal" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/dist/terminal.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>

    <!-- Title / tab bar -->
    <div class="titlebar">
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="tab-add" id="addTab" title="New session" aria-label="New session">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="group">
        <button class="icon-btn" id="layoutSingle" title="Single panel" aria-label="Single panel">
          <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="icon-btn" id="layoutV" title="Split right" aria-label="Split right">
          <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M10 3v14" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="icon-btn" id="layoutH" title="Split bottom" aria-label="Split bottom">
          <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M2 10h16" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="icon-btn" id="layoutGrid" title="Grid 2x2" aria-label="Grid 2x2">
          <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M10 3v14M2 10h16" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Search terminal…</span>
          <span class="kbd-hint">Ctrl F</span>
        </div>
      </div>
      <div class="group">
        <button class="icon-btn" id="clearBtn" title="Clear active panel" aria-label="Clear active panel">
          <svg viewBox="0 0 20 20" fill="none"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 20 20" fill="none"><path d="M7 3H3v4M13 3h4v4M17 13v4h-4M3 13v4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.4"/><path d="M10 2v2.2M10 15.8V18M18 10h-2.2M4.2 10H2M15.4 4.6l-1.5 1.5M6.1 13.9l-1.5 1.5M15.4 15.4l-1.5-1.5M6.1 6.1L4.6 4.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- Workspace (xterm.js renders here) -->
    <div class="workspace">
      <div class="pane-grid" id="paneGrid"></div>
    </div>

    <!-- Status bar (bottom) -->
    <div class="statusbar">
      <div class="status-item"><span class="status-dot" id="connDot"></span><span id="connLabel">connected</span></div>
      <div class="status-item" id="shellLabel">zsh</div>
      <div class="status-item" id="pathLabel">~</div>
      <div class="status-item">⎇ main</div>
      <div class="spacer"></div>
      <div class="status-item" id="layoutLabel">1 panel</div>
      <div class="status-item">UTF-8</div>
    </div>

    <!-- On-screen key bar (touch devices) -->
    <div id="keybar" class="hidden"></div>

    <!-- Settings drawer overlay + drawer -->
    <div class="overlay" id="overlay"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <h2>Terminal Settings</h2>
        <button class="icon-btn" id="closeDrawer" aria-label="Close settings">
          <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="drawer-tabs" id="drawerTabs">
        <button class="dtab active" data-tab="appearance">Appearance</button>
        <button class="dtab" data-tab="behavior">Behavior</button>
        <button class="dtab" data-tab="keybinds">Keybinds</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>

    <!-- Modal for new tab naming -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle">New tab name</h3>
        <input type="text" id="newTabInput" maxlength="30" placeholder="e.g. server, logs, deploy" />
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modalCancel">Cancel</button>
          <button class="btn btn-primary" id="modalCreate">Create</button>
        </div>
      </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- Status toast (legacy) -->
    <div id="status" role="status" aria-live="polite"></div>

    <!-- Mobile top bar -->
    <div id="mobilebar" class="hidden"></div>

    <script type="module" src="/dist/terminal.js"></script>
  </body>
</html>
